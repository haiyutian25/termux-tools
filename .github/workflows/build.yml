name: Build termux-tools

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64, arm, i686, x86_64]
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc dpkg-dev

      - name: Get version
        id: version
        run: |
          VERSION=$(grep 'AC_INIT' configure.ac | sed -E 's/.*\[([0-9.]+)\].*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Prepare
        run: |
          autoreconf -vfi
          mkdir build

      - name: Configure
        run: |
          cd build
          ../configure --prefix=/data/data/com.termux/files/usr

      - name: Make
        run: |
          cd build
          make

      - name: Make install to staging directory
        run: |
          cd build
          make install DESTDIR=$(pwd)/staging

      - name: Create DEBIAN control directory
        run: |
          cd build/staging
          mkdir -p DEBIAN
          cat > DEBIAN/control << EOF
          Package: termux-tools
          Version: ${{ steps.version.outputs.version }}
          Architecture: ${{ matrix.arch }}
          Maintainer: haiyutian25
          Depends: bash, coreutils
          Section: utils
          Priority: optional
          Description: Termux basic system tools (Chinese modified)
           Basic system tools for Termux with Chinese localization.
           Modified welcome messages and removed Google Play Store warnings.
          EOF

      - name: Build .deb package
        run: |
          cd build/staging
          dpkg-deb --build . ../termux-tools_${{ steps.version.outputs.version }}_${{ matrix.arch }}.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: termux-tools-${{ matrix.arch }}
          path: build/termux-tools_${{ steps.version.outputs.version }}_${{ matrix.arch }}.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Get version
        id: version
        run: |
          # Extract version from one of the deb files
          DEB_FILE=$(find artifacts -name "*.deb" | head -n 1)
          VERSION=$(dpkg-deb -f "$DEB_FILE" Version)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}-$(date +%Y%m%d-%H%M%S)"
          
          # Check if we're in a git repository
          if [ ! -d .git ]; then
            git init
            git remote add origin https://github.com/${{ github.repository }}
            git fetch origin ${{ github.ref }}
            git checkout -b temp-branch
          fi
          
          gh release create "$TAG" \
            --title "Termux Tools v${{ steps.version.outputs.version }} (Chinese)" \
            --notes "Automated build of termux-tools with Chinese modifications" \
            --repo ${{ github.repository }} \
            artifacts/**/*.deb
